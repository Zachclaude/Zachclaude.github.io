<style>:root{
  --paper:#f7f3ea;--sheet:#fffdf8;--ink:#1d2b23;--muted:#5c665e;--line:#dfd7c8;
  --forest:#0E4A37;--leaf:#2C9A68;--clay:#C8402A;
  --f-display:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
  --f-body:"Noto Sans SC","Source Han Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{width:min(1040px,92vw);margin:0 auto}
header{padding:28px 0 0}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:700;letter-spacing:.02em;font-size:20px}
.brand svg{width:28px;height:28px;flex:none}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
main{padding:56px 0 72px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--forest);opacity:.75}
h1{font-family:var(--f-display);font-size:clamp(34px,5vw,54px);line-height:1.15;letter-spacing:-.01em;margin:14px 0 16px;max-width:18ch;text-wrap:balance}
.lede{font-size:18px;color:var(--muted);max-width:44em;margin:0 0 40px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:24px;text-decoration:none;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s cubic-bezier(.22,1,.36,1),border-color .3s cubic-bezier(.22,1,.36,1)}
.card:hover{transform:translateY(-2px);border-color:#b9c9bd;box-shadow:0 20px 40px -32px rgba(14,74,55,.5)}
.card:active{transform:translateY(0)}
.card:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:.01em}
.tag{font-size:11px;letter-spacing:.06em;color:var(--forest);border:1px solid #c9dccf;background:#eef5ef;border-radius:999px;padding:3px 9px;white-space:nowrap}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.65}
.card .go{margin-top:auto;font-size:14px;font-weight:600;color:var(--forest);display:inline-flex;align-items:center;gap:8px}
.card .go svg{transition:transform .3s cubic-bezier(.22,1,.36,1)}
.card:hover .go svg{transform:translateX(3px)}
footer{border-top:1px solid var(--line);padding:20px 0 32px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
@media (max-width:640px){main{padding:36px 0 56px}h1{font-size:clamp(30px,9vw,42px)}.card{padding:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}

body{min-height:100dvh;display:grid;place-items:center;padding:24px}
.box{width:min(620px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:clamp(28px,6vw,52px);box-shadow:0 30px 70px -55px rgba(14,74,55,.6)}
.code{font-family:var(--f-display);font-size:clamp(56px,12vw,92px);line-height:1;color:var(--forest);margin:22px 0 8px;font-variant-numeric:tabular-nums}
h1{font-size:clamp(24px,4vw,32px);margin:0 0 10px}
p{color:var(--muted);margin:0 0 24px;max-width:48ch}
.links{display:flex;flex-wrap:wrap;gap:12px}
.links a{display:inline-flex;align-items:center;min-height:48px;padding:10px 20px;border:1px solid var(--line);border-radius:999px;color:var(--forest);text-decoration:none;font-weight:500;transition:background-color .3s cubic-bezier(.22,1,.36,1),border-color .3s cubic-bezier(.22,1,.36,1)}
.links a:hover{background:#eef5ef;border-color:var(--leaf)}
.links a:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
.links a.primary{background:var(--forest);border-color:var(--forest);color:#fff}
</style>
</head>
